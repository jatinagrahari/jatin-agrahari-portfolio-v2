    height="180"
    viewBox="0 0 180 180"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <pattern
            id="dots"
            x="0"
            y="0"
            width="12"
            height="12"
            patternUnits="userSpaceOnUse"
        >
            <circle
                cx="2"
                cy="2"
                r="1.3"
                fill="#0F8A72"
                opacity="0.92"
            />
        </pattern>
